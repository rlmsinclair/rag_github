<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG System UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/themes/prism.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/components/prism-javascript.min.js"></script>
    <style>
        .file-preview {
            max-height: calc(100vh - 400px);
            overflow-y: auto;
        }
        .folder-toggle {
            cursor: pointer;
            user-select: none;
        }
        .folder-toggle:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .folder-content {
            margin-left: 1.5rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">RAG System Interface</h1>

        <!-- Repository Addition Form -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Add Repository</h2>
            <div class="flex gap-4">
                <input
                    type="text"
                    id="repoUrl"
                    placeholder="Enter GitHub repository URL (Press Enter to add)"
                    class="flex-1 p-2 border rounded"
                    onkeydown="handleRepoKeyDown(event)"
                >
                <button
                    onclick="addRepository()"
                    class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                >
                    Add Repository
                </button>
            </div>
            <div id="repoStatus" class="mt-2 text-sm"></div>
        </div>

        <!-- Query System -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Query System</h2>

            <!-- Search Input -->
            <div class="mb-6">
                <div class="flex gap-4 mb-4">
                    <input
                        type="text"
                        id="searchQuery"
                        placeholder="Enter search query to find relevant files (Press Enter to search)"
                        class="flex-1 p-2 border rounded"
                        onkeydown="handleSearchKeyDown(event)"
                    >
                    <button
                        onclick="searchFiles()"
                        id="searchButton"
                        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                    >
                        Search Files
                    </button>
                </div>
            </div>

            <!-- Split View Container -->
            <div class="flex gap-6">
                <!-- Left Side: Search Results and File Selection -->
                <div class="w-1/2">
                    <h3 class="text-lg font-medium mb-4">Results</h3>
                    <div id="searchResults" class="space-y-2 max-h-[500px] overflow-y-auto"></div>
                </div>

                <!-- Right Side: Preview -->
                <div class="w-1/2">
                    <h3 class="text-lg font-medium mb-4">Preview</h3>
                    <div id="preview" class="file-preview p-4 bg-gray-50 rounded">
                        <div class="text-gray-500 italic">Select an item to preview its contents</div>
                    </div>
                </div>
            </div>

            <!-- Prompt Input -->
            <div class="mt-8">
                <h3 class="text-lg font-medium mb-4">Enter Your Prompt</h3>
                <div class="text-sm text-gray-600 mb-2">
                    Press Enter to submit, Shift + Enter for new line
                </div>
                <textarea
                    id="promptInput"
                    placeholder="Enter your prompt to analyze the selected files"
                    class="w-full p-2 border rounded h-32 mb-4"
                    disabled
                    onkeydown="handlePromptKeyDown(event)"
                ></textarea>
                <div class="flex items-center gap-4">
                    <button
                        onclick="submitPrompt()"
                        id="submitButton"
                        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed"
                        disabled
                    >
                        Submit Prompt
                    </button>
                    <div id="selectedFilesCount" class="text-sm text-gray-600">
                        No files selected
                    </div>
                    <div id="loadingIndicator" class="hidden">
                        <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-green-500"></div>
                    </div>
                </div>
            </div>

            <!-- Response Area -->
            <div id="response" class="mt-4 p-4 bg-gray-50 rounded min-h-[200px] whitespace-pre-wrap"></div>
        </div>
    </div>
    <script>
        let selectedFiles = new Set();
        let fileContents = new Map();
        let currentRepository = null;

        function getFileExtension(filename) {
            return filename.split('.').pop().toLowerCase();
        }

        function getPrismLanguage(filename) {
            const ext = getFileExtension(filename);
            const languageMap = {
                'py': 'python',
                'js': 'javascript',
                'jsx': 'javascript',
                'ts': 'typescript',
                'tsx': 'typescript',
                'html': 'html',
                'css': 'css',
                'json': 'json',
                'md': 'markdown'
            };
            return languageMap[ext] || 'plaintext';
        }

        function toggleFolder(folderId) {
            const folderContent = document.getElementById(folderId);
            const folderIcon = folderContent.previousElementSibling.querySelector('.folder-icon');

            if (folderContent.classList.contains('hidden')) {
                folderContent.classList.remove('hidden');
                folderIcon.textContent = '📂';
            } else {
                folderContent.classList.add('hidden');
                folderIcon.textContent = '📁';
            }
        }

        function selectAllInFolder(repoId, folderPath, event) {
            event.stopPropagation();

            const files = Array.from(fileContents.values())
                .filter(file =>
                    file.repo_id === repoId &&
                    file.file_path.startsWith(folderPath + '/')
                );

            files.forEach(file => {
                selectedFiles.add(file.id);
                const checkbox = document.getElementById(`checkbox-${file.id}`);
                if (checkbox) {
                    checkbox.innerHTML = '✓';
                }
            });

            updateSelectedFilesCount();
            updatePromptState();
        }

        function showRepositoryFiles(repo, files) {
            console.log('Showing repository:', repo);
            console.log('Repository files:', files);

            const preview = document.getElementById('preview');
            const relevancePercent = (repo.similarity * 100).toFixed(1);

            if (!files || files.length === 0) {
                preview.innerHTML = `
                    <div class="mb-6">
                        <div class="flex items-center justify-between mb-4">
                            <h4 class="text-lg font-medium">📦 ${repo.repo_name}</h4>
                            <div class="text-sm text-gray-500">
                                Relevance: ${relevancePercent}%
                            </div>
                        </div>
                        <div class="text-gray-500 italic">No files found in this repository</div>
                    </div>
                `;
                return;
            }

            // Group files by folder
            const filesByFolder = {};
            files.forEach(file => {
                const pathParts = file.file_path.split('/');
                if (pathParts.length > 1) {
                    const folderPath = pathParts.slice(0, -1).join('/');
                    if (!filesByFolder[folderPath]) {
                        filesByFolder[folderPath] = [];
                    }
                    filesByFolder[folderPath].push(file);
                } else {
                    if (!filesByFolder['root']) filesByFolder['root'] = [];
                    filesByFolder['root'].push(file);
                }
            });

            let html = `
                <div class="mb-6">
                    <div class="flex items-center justify-between mb-4">
                        <h4 class="text-lg font-medium">📦 ${repo.repo_name}</h4>
                        <div class="text-sm text-gray-500">
                            Relevance: ${relevancePercent}%
                        </div>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-1.5 mb-4">
                        <div class="bg-blue-600 h-1.5 rounded-full" style="width: ${relevancePercent}%"></div>
                    </div>
                    <div class="mb-4">
                        <p class="text-gray-600">${repo.overview || repo.description || 'No description available'}</p>
                        ${repo.main_technologies?.length ? `
                            <div class="mt-2">
                                <span class="text-sm font-medium">Technologies: </span>
                                <span class="text-sm text-gray-600">${repo.main_technologies.join(', ')}</span>
                            </div>
                        ` : ''}
                    </div>
                    <div class="flex items-center gap-4 mb-4">
                        <button onclick="selectAllRepositoryFiles(${repo.id})"
                                class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                            Select All Files
                        </button>
                        <button onclick="deselectAllRepositoryFiles(${repo.id})"
                                class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
                            Deselect All
                        </button>
                    </div>
                    <div class="border rounded-lg">
            `;

            // Add folders and their files
            Object.entries(filesByFolder).forEach(([folderPath, folderFiles]) => {
                if (folderPath === 'root') {
                    // Root files
                    folderFiles.forEach(file => {
                        const fileRelevancePercent = (file.similarity * 100).toFixed(1);
                        html += `
                            <div class="border-b last:border-b-0">
                                <div class="p-3 hover:bg-gray-50 cursor-pointer flex items-center gap-3"
                                     onclick="toggleFileSelection(${file.id}, this)">
                                    <div class="w-6 h-6 border-2 border-green-500 rounded flex items-center justify-center file-checkbox"
                                         id="checkbox-${file.id}">
                                        ${selectedFiles.has(file.id) ? '✓' : ''}
                                    </div>
                                    <span class="mr-2">📄</span>
                                    <div class="flex-grow">
                                        <div class="text-sm font-medium">${file.file_path}</div>
                                        <div class="text-xs text-gray-500">Relevance: ${fileRelevancePercent}%</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    // Folder with files
                    const folderId = `folder-${repo.id}-${folderPath.replace(/\//g, '-')}`;
                    html += `
                        <div class="border-b last:border-b-0">
                            <div class="p-3 hover:bg-gray-50 cursor-pointer flex items-center gap-3"
                                 onclick="toggleFolder('${folderId}')">
                                <span class="folder-icon">📁</span>
                                <div class="flex-grow">
                                    <div class="text-sm font-medium">${folderPath}</div>
                                </div>
                                <button onclick="selectAllInFolder(${repo.id}, '${folderPath}', event)"
                                        class="text-xs text-green-600 hover:text-green-800 px-2 py-1 rounded border border-green-600 hover:bg-green-50">
                                    Select All
                                </button>
                            </div>
                            <div id="${folderId}" class="hidden pl-8 border-t bg-gray-50">
                    `;

                    folderFiles.forEach(file => {
                        const fileRelevancePercent = (file.similarity * 100).toFixed(1);
                        html += `
                            <div class="border-b last:border-b-0">
                                <div class="p-3 hover:bg-gray-100 cursor-pointer flex items-center gap-3"
                                     onclick="toggleFileSelection(${file.id}, this)">
                                    <div class="w-6 h-6 border-2 border-green-500 rounded flex items-center justify-center file-checkbox"
                                         id="checkbox-${file.id}">
                                        ${selectedFiles.has(file.id) ? '✓' : ''}
                                    </div>
                                    <span class="mr-2">📄</span>
                                    <div class="flex-grow">
                                        <div class="text-sm font-medium">${file.file_path.split('/').pop()}</div>
                                        <div class="text-xs text-gray-500">Relevance: ${fileRelevancePercent}%</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                }
            });

            html += `
                    </div>
                </div>
            `;

            preview.innerHTML = html;
        }
        function updateFilePreview(fileId) {
            const fileData = fileContents.get(fileId);
            const preview = document.getElementById('preview');

            if (!fileData) {
                preview.innerHTML = '<div class="text-gray-500 italic">Select an item to preview its contents</div>';
                return;
            }

            const language = getPrismLanguage(fileData.file_path);
            const highlightedCode = Prism.highlight(
                fileData.content,
                Prism.languages[language],
                language
            );

            preview.innerHTML = `
                <div class="mb-2">
                    <div class="font-medium">${fileData.repo_name}/${fileData.file_path}</div>
                    <div class="mt-2">
                        <p class="font-medium">Description:</p>
                        <p class="text-gray-600">${fileData.description}</p>
                    </div>
                    <div class="mt-2">
                        <p class="font-medium">Key Components:</p>
                        <ul class="list-disc pl-5 text-gray-600">
                            ${fileData.key_components.map(c => `<li>${c}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="mt-2">
                        <p class="font-medium">Dependencies:</p>
                        <p class="text-gray-600">${fileData.dependencies.join(', ')}</p>
                    </div>
                </div>
                <div class="mt-4">
                    <p class="font-medium">Content:</p>
                    <pre class="language-${language}"><code class="language-${language}">${highlightedCode}</code></pre>
                </div>
            `;
        }

        function updateSelectedFilesCount() {
            const count = selectedFiles.size;
            const countElement = document.getElementById('selectedFilesCount');
            countElement.textContent = count === 0
                ? 'No files selected'
                : `${count} file${count === 1 ? '' : 's'} selected`;
        }

        function updatePromptState() {
            const promptInput = document.getElementById('promptInput');
            const submitButton = document.getElementById('submitButton');
            const disabled = selectedFiles.size === 0;
            promptInput.disabled = disabled;
            submitButton.disabled = disabled;
        }

        function toggleFileSelection(fileId, element) {
            const checkbox = document.getElementById(`checkbox-${fileId}`);
            if (selectedFiles.has(fileId)) {
                selectedFiles.delete(fileId);
                checkbox.innerHTML = '';
            } else {
                selectedFiles.add(fileId);
                checkbox.innerHTML = '✓';
            }

            updateSelectedFilesCount();
            updatePromptState();
        }

        function selectAllRepositoryFiles(repoId) {
            const files = Array.from(fileContents.values()).filter(f => f.repo_id === repoId);
            files.forEach(file => {
                selectedFiles.add(file.id);
                const checkbox = document.getElementById(`checkbox-${file.id}`);
                if (checkbox) {
                    checkbox.innerHTML = '✓';
                }
            });
            updateSelectedFilesCount();
            updatePromptState();
        }

        function deselectAllRepositoryFiles(repoId) {
            const files = Array.from(fileContents.values()).filter(f => f.repo_id === repoId);
            files.forEach(file => {
                selectedFiles.delete(file.id);
                const checkbox = document.getElementById(`checkbox-${file.id}`);
                if (checkbox) {
                    checkbox.innerHTML = '';
                }
            });
            updateSelectedFilesCount();
            updatePromptState();
        }

        function handleRepoKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                addRepository();
            }
        }

        function handleSearchKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                searchFiles();
            }
        }

        function handlePromptKeyDown(event) {
            if (event.key === 'Enter') {
                if (event.shiftKey) {
                    return;
                } else {
                    event.preventDefault();
                    submitPrompt();
                }
            }
        }

        async function searchFiles() {
            const query = document.getElementById('searchQuery').value;
            const resultsDiv = document.getElementById('searchResults');
            const searchButton = document.getElementById('searchButton');

            if (!query) {
                alert('Please enter a search query');
                return;
            }

            searchButton.disabled = true;
            resultsDiv.innerHTML = 'Searching...';
            selectedFiles.clear();
            fileContents.clear();
            updateSelectedFilesCount();
            updatePromptState();
            document.getElementById('preview').innerHTML = '<div class="text-gray-500 italic">Select a repository to view files</div>';

            try {
                const response = await fetch('/search_files', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query }),
                });

                const results = await response.json();
                console.log('Search results:', results);

                if (response.ok) {
                    // Store all files in fileContents
                    const files = results.filter(r => r.type === 'file');
                    console.log('Files found:', files.length);

                    files.forEach(file => {
                        if (file && file.id) {
                            fileContents.set(file.id, file);
                        }
                    });

                    // Show only repositories in the results list
                    const repositories = results.filter(r => r.type === 'repository')
                        .sort((a, b) => b.similarity - a.similarity);
                    console.log('Repositories found:', repositories.length);

                    let html = '<div class="space-y-2">';

                    repositories.forEach(repo => {
                        const relevancePercent = (repo.similarity * 100).toFixed(1);
                        const repoFiles = files.filter(f => f.repo_id === repo.id);
                        console.log(`Files for repo ${repo.repo_name}:`, repoFiles.length);

                        html += `
                            <div class="p-3 border rounded cursor-pointer hover:bg-gray-50 transition-colors"
                                 onclick="showRepositoryFiles(${JSON.stringify({
                                     id: repo.id,
                                     repo_name: repo.repo_name,
                                     similarity: repo.similarity,
                                     overview: repo.overview,
                                     description: repo.description,
                                     main_technologies: repo.main_technologies
                                 })}, ${JSON.stringify(repoFiles)})">
                                <div class="flex items-center justify-between">
                                    <div class="font-medium">📦 ${repo.repo_name}</div>
                                    <div class="text-sm text-gray-500">
                                        Relevance: ${relevancePercent}%
                                    </div>
                                </div>
                                <div class="text-sm text-gray-600 mt-1">
                                    ${repo.overview || repo.description || 'No description available'}
                                </div>
                                <div class="text-xs text-gray-500 mt-1">
                                    ${repoFiles.length} files found
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-1.5 mt-2">
                                    <div class="bg-blue-600 h-1.5 rounded-full" style="width: ${relevancePercent}%"></div>
                                </div>
                            </div>
                        `;
                    });

                    html += '</div>';
                    resultsDiv.innerHTML = html || '<div class="text-gray-500">No repositories found</div>';
                } else {
                    throw new Error(results.error);
                }
            } catch (error) {
                console.error('Search error:', error);
                resultsDiv.innerHTML = `Error: ${error.message}`;
            } finally {
                searchButton.disabled = false;
            }
        }

        async function submitPrompt() {
            const prompt = document.getElementById('promptInput').value;
            const responseDiv = document.getElementById('response');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const submitButton = document.getElementById('submitButton');

            if (!prompt) {
                alert('Please enter a prompt');
                return;
            }

            responseDiv.textContent = '';
            loadingIndicator.classList.remove('hidden');
            submitButton.disabled = true;

            try {
                const response = await fetch('/stream_prompt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        file_ids: Array.from(selectedFiles),
                        prompt: prompt
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const {value, done} = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            if (data.error) {
                                responseDiv.textContent += `Error: ${data.error}\n`;
                                return;
                            }
                            responseDiv.textContent += data.text;
                        }
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                responseDiv.textContent = `Error: ${error.message}`;
            } finally {
                loadingIndicator.classList.add('hidden');
                submitButton.disabled = false;
            }
        }

        async function addRepository() {
            const repoUrl = document.getElementById('repoUrl').value;
            const statusDiv = document.getElementById('repoStatus');

            if (!repoUrl) {
                alert('Please enter a repository URL');
                return;
            }

            statusDiv.textContent = 'Adding repository...';
            statusDiv.className = 'mt-2 text-sm text-blue-500';

            try {
                const response = await fetch('/add_repository', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ repo_url: repoUrl }),
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = data.message;
                    statusDiv.className = 'mt-2 text-sm text-green-500';
                    document.getElementById('repoUrl').value = '';
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                statusDiv.textContent = `Error: ${error.message}`;
                statusDiv.className = 'mt-2 text-sm text-red-500';
            }
        }
    </script>
</body>
</html>
