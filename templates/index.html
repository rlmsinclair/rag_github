<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG System UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">RAG System Interface</h1>

        <!-- Repository Addition Form -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Add Repository</h2>
            <div class="flex gap-4">
                <input
                    type="text"
                    id="repoUrl"
                    placeholder="Enter GitHub repository URL"
                    class="flex-1 p-2 border rounded"
                >
                <button
                    onclick="addRepository()"
                    class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                >
                    Add Repository
                </button>
            </div>
            <div id="repoStatus" class="mt-2 text-sm"></div>
        </div>

        <!-- Query Form -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Query System</h2>

            <!-- Search Query Input -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Search Query (to find relevant files)
                </label>
                <input
                    type="text"
                    id="searchQuery"
                    placeholder="e.g., 'authentication implementation' or 'database schema'"
                    class="w-full p-2 border rounded"
                >
            </div>

            <!-- Prompt Input -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Prompt (what to do with the found files)
                </label>
                <textarea
                    id="promptInput"
                    placeholder="e.g., 'Explain how authentication is implemented' or 'List all database tables and their relationships'"
                    class="w-full p-2 border rounded h-32"
                ></textarea>
            </div>

            <div class="flex gap-4 items-center">
                <button
                    onclick="submitQuery()"
                    id="submitButton"
                    class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
                >
                    Submit Query
                </button>
                <div id="loadingIndicator" class="hidden">
                    <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-green-500"></div>
                </div>
            </div>

            <div id="response" class="mt-4 p-4 bg-gray-50 rounded min-h-[200px] whitespace-pre-wrap"></div>
        </div>
    </div>

    <script>
        async function submitQuery() {
            const searchQuery = document.getElementById('searchQuery').value;
            const prompt = document.getElementById('promptInput').value;
            const responseDiv = document.getElementById('response');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const submitButton = document.getElementById('submitButton');

            if (!searchQuery || !prompt) {
                alert('Please provide both a search query and a prompt');
                return;
            }

            responseDiv.textContent = '';
            loadingIndicator.classList.remove('hidden');
            submitButton.disabled = true;
            submitButton.classList.add('opacity-50');

            try {
                const response = await fetch('/stream_query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        search_query: searchQuery,
                        prompt: prompt
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const {value, done} = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            if (data.error) {
                                responseDiv.textContent += `Error: ${data.error}\n`;
                                return;
                            }
                            responseDiv.textContent += data.text;
                        }
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                responseDiv.textContent = `Error: ${error.message}`;
            } finally {
                loadingIndicator.classList.add('hidden');
                submitButton.disabled = false;
                submitButton.classList.remove('opacity-50');
            }
        }

        async function addRepository() {
            const repoUrl = document.getElementById('repoUrl').value;
            const statusDiv = document.getElementById('repoStatus');

            statusDiv.textContent = 'Adding repository...';
            statusDiv.className = 'mt-2 text-sm text-blue-500';

            try {
                const response = await fetch('/add_repository', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ repo_url: repoUrl }),
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = data.message;
                    statusDiv.className = 'mt-2 text-sm text-green-500';
                    document.getElementById('repoUrl').value = '';
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                statusDiv.textContent = `Error: ${error.message}`;
                statusDiv.className = 'mt-2 text-sm text-red-500';
            }
        }
    </script>
</body>
</html>
