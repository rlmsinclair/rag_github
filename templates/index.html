<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG System UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/themes/prism.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/components/prism-javascript.min.js"></script>
    <style>
        .file-preview {
            max-height: calc(100vh - 400px);
            overflow-y: auto;
        }
        .folder-toggle {
            cursor: pointer;
            user-select: none;
        }
        .folder-toggle:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        .folder-content {
            margin-left: 1.5rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">RAG System Interface</h1>

        <!-- Repository Addition Form -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">Add Repository</h2>
            <div class="flex gap-4">
                <input
                    type="text"
                    id="repoUrl"
                    placeholder="Enter GitHub repository URL (Press Enter to add)"
                    class="flex-1 p-2 border rounded"
                    onkeydown="handleRepoKeyDown(event)"
                >
                <button
                    onclick="addRepository()"
                    class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                >
                    Add Repository
                </button>
            </div>
            <div id="repoStatus" class="mt-2 text-sm"></div>
        </div>

        <!-- Query System -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Query System</h2>

            <!-- Search Input -->
            <div class="mb-6">
                <div class="flex gap-4 mb-4">
                    <input
                        type="text"
                        id="searchQuery"
                        placeholder="Enter search query to find relevant files (Press Enter to search)"
                        class="flex-1 p-2 border rounded"
                        onkeydown="handleSearchKeyDown(event)"
                    >
                    <button
                        onclick="searchFiles()"
                        id="searchButton"
                        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                    >
                        Search Files
                    </button>
                </div>
            </div>

            <!-- Split View Container -->
            <div class="flex gap-6">
                <!-- Left Side: Search Results and File Selection -->
                <div class="w-1/2">
                    <h3 class="text-lg font-medium mb-4">Results</h3>
                    <div id="searchResults" class="space-y-2 max-h-[500px] overflow-y-auto"></div>
                </div>

                <!-- Right Side: Preview -->
                <div class="w-1/2">
                    <h3 class="text-lg font-medium mb-4">Preview</h3>
                    <div id="preview" class="file-preview p-4 bg-gray-50 rounded">
                        <div class="text-gray-500 italic">Select an item to preview its contents</div>
                    </div>
                </div>
            </div>

            <!-- Prompt Input -->
            <div class="mt-8">
                <h3 class="text-lg font-medium mb-4">Enter Your Prompt</h3>
                <div class="text-sm text-gray-600 mb-2">
                    Press Enter to submit, Shift + Enter for new line
                </div>
                <textarea
                    id="promptInput"
                    placeholder="Enter your prompt to analyze the selected files"
                    class="w-full p-2 border rounded h-32 mb-4"
                    disabled
                    onkeydown="handlePromptKeyDown(event)"
                ></textarea>
                <div class="flex items-center gap-4">
                    <button
                        onclick="submitPrompt()"
                        id="submitButton"
                        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed"
                        disabled
                    >
                        Submit Prompt
                    </button>
                    <div id="selectedFilesCount" class="text-sm text-gray-600">
                        No files selected
                    </div>
                    <div id="loadingIndicator" class="hidden">
                        <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-green-500"></div>
                    </div>
                </div>
            </div>

            <!-- Response Area -->
            <div id="response" class="mt-4 p-4 bg-gray-50 rounded min-h-[200px] whitespace-pre-wrap"></div>
        </div>
    </div>

    <script>
        let selectedFiles = new Set();
        let fileContents = new Map();
        let currentRepository = null;

        function getFileExtension(filename) {
            return filename.split('.').pop().toLowerCase();
        }

        function getPrismLanguage(filename) {
            const ext = getFileExtension(filename);
            const languageMap = {
                'py': 'python',
                'js': 'javascript',
                'jsx': 'javascript',
                'ts': 'typescript',
                'tsx': 'typescript',
                'html': 'html',
                'css': 'css',
                'json': 'json',
                'md': 'markdown'
            };
            return languageMap[ext] || 'plaintext';
        }

        function toggleFolder(repoId, folderPath) {
            const folderContent = document.querySelector(`#folder-${repoId}-${folderPath.replace(/\//g, '-')}`);
            if (folderContent) {
                folderContent.classList.toggle('hidden');
                const icon = document.querySelector(`#folder-icon-${repoId}-${folderPath.replace(/\//g, '-')}`);
                if (icon) {
                    icon.textContent = folderContent.classList.contains('hidden') ? '📁' : '📂';
                }
            }
        }

        function selectAllInFolder(repoId, folderPath, event) {
            event.stopPropagation();
            const files = Array.from(fileContents.values())
                .filter(file =>
                    file.repo_id === repoId &&
                    file.file_path.startsWith(folderPath)
                );

            const allSelected = files.every(file => selectedFiles.has(file.id));

            files.forEach(file => {
                const element = document.querySelector(`#file-${file.id}`);
                if (allSelected) {
                    selectedFiles.delete(file.id);
                    element?.classList.remove('bg-blue-100');
                } else {
                    selectedFiles.add(file.id);
                    element?.classList.add('bg-blue-100');
                }
            });

            updateSelectedFilesCount();
            updatePromptState();
        }

        function showRepositoryPreview(repo) {
            const preview = document.getElementById('preview');
            preview.innerHTML = `
                <div class="mb-4">
                    <h4 class="text-lg font-medium">${repo.repo_name}</h4>
                    <div class="mt-2">
                        <p class="font-medium">Overview:</p>
                        <p class="text-gray-600">${repo.overview}</p>
                    </div>
                    <div class="mt-2">
                        <p class="font-medium">Main Technologies:</p>
                        <p class="text-gray-600">${repo.main_technologies.join(', ')}</p>
                    </div>
                    <div class="mt-2">
                        <p class="font-medium">Key Features:</p>
                        <ul class="list-disc pl-5 text-gray-600">
                            ${repo.key_features.map(f => `<li>${f}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="mt-2">
                        <p class="font-medium">Architecture:</p>
                        <p class="text-gray-600">${repo.architecture}</p>
                    </div>
                    <div class="mt-2">
                        <p class="font-medium">Dependencies:</p>
                        <p class="text-gray-600">${repo.dependencies.join(', ')}</p>
                    </div>
                </div>
            `;
        }

        function updateFilePreview(fileId) {
            const fileData = fileContents.get(fileId);
            const preview = document.getElementById('preview');

            if (!fileData) {
                preview.innerHTML = '<div class="text-gray-500 italic">Select an item to preview its contents</div>';
                return;
            }

            const language = getPrismLanguage(fileData.file_path);
            const highlightedCode = Prism.highlight(
                fileData.content,
                Prism.languages[language],
                language
            );

            preview.innerHTML = `
                <div class="mb-2">
                    <div class="font-medium">${fileData.repo_name}/${fileData.file_path}</div>
                    <div class="mt-2">
                        <p class="font-medium">Description:</p>
                        <p class="text-gray-600">${fileData.description}</p>
                    </div>
                    <div class="mt-2">
                        <p class="font-medium">Key Components:</p>
                        <ul class="list-disc pl-5 text-gray-600">
                            ${fileData.key_components.map(c => `<li>${c}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="mt-2">
                        <p class="font-medium">Dependencies:</p>
                        <p class="text-gray-600">${fileData.dependencies.join(', ')}</p>
                    </div>
                </div>
                <div class="mt-4">
                    <p class="font-medium">Content:</p>
                    <pre class="language-${language}"><code class="language-${language}">${highlightedCode}</code></pre>
                </div>
            `;
        }

        function updateSelectedFilesCount() {
            const count = selectedFiles.size;
            const countElement = document.getElementById('selectedFilesCount');
            countElement.textContent = count === 0
                ? 'No files selected'
                : `${count} file${count === 1 ? '' : 's'} selected`;
        }

        function updatePromptState() {
            const promptInput = document.getElementById('promptInput');
            const submitButton = document.getElementById('submitButton');
            const disabled = selectedFiles.size === 0;
            promptInput.disabled = disabled;
            submitButton.disabled = disabled;
        }

        function toggleFileSelection(fileId, element) {
            if (selectedFiles.has(fileId)) {
                selectedFiles.delete(fileId);
                element.classList.remove('bg-blue-100');
            } else {
                selectedFiles.add(fileId);
                element.classList.add('bg-blue-100');
            }

            updateSelectedFilesCount();
            updatePromptState();
            updateFilePreview(fileId);
        }

        function handleRepoKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                addRepository();
            }
        }

        function handleSearchKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                searchFiles();
            }
        }

        function handlePromptKeyDown(event) {
            if (event.key === 'Enter') {
                if (event.shiftKey) {
                    // Let the default behavior happen (new line)
                    return;
                } else {
                    event.preventDefault();
                    submitPrompt();
                }
            }
        }

        async function searchFiles() {
            const query = document.getElementById('searchQuery').value;
            const resultsDiv = document.getElementById('searchResults');
            const searchButton = document.getElementById('searchButton');

            if (!query) {
                alert('Please enter a search query');
                return;
            }

            searchButton.disabled = true;
            resultsDiv.innerHTML = 'Searching...';
            selectedFiles.clear();
            fileContents.clear();
            currentRepository = null;
            updateSelectedFilesCount();
            updatePromptState();
            updateFilePreview(null);

            try {
                const response = await fetch('/search_files', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query }),
                });

                const results = await response.json();

                if (response.ok) {
                    // Group results by repository
                    const repositories = results.filter(r => r.type === 'repository');
                    const files = results.filter(r => r.type === 'file');

                    // Store file contents
                    files.forEach(file => {
                        fileContents.set(file.id, file);
                    });

                    // Generate HTML
                    let html = '';

                    // Repositories section
                    if (repositories.length > 0) {
                        html += '<div class="mb-6"><h4 class="text-md font-medium mb-2">Repositories</h4>';
                        repositories.forEach(repo => {
                            html += `
                                <div class="p-3 border rounded cursor-pointer hover:bg-gray-50 transition-colors mb-2"
                                     onclick="showRepositoryPreview(${JSON.stringify(repo).replace(/"/g, '&quot;')})">
                                    <div class="font-medium">📦 ${repo.repo_name}</div>
                                    <div class="text-sm text-gray-600 mt-1">${repo.overview}</div>
                                </div>
                            `;
                        });
                        html += '</div>';
                    }

                    // Files section
                    if (files.length > 0) {
                        html += '<div><h4 class="text-md font-medium mb-2">Files</h4>';

                        // Group files by repository and folder structure
                        const filesByRepo = {};
                        files.forEach(file => {
                            if (!filesByRepo[file.repo_id]) {
                                filesByRepo[file.repo_id] = {
                                    repo_name: file.repo_name,
                                    folders: {},
                                    files: []
                                };
                            }

                            // Add to appropriate folder
                            const pathParts = file.file_path.split('/');
                            if (pathParts.length > 1) {
                                const folderPath = pathParts.slice(0, -1).join('/');
                                if (!filesByRepo[file.repo_id].folders[folderPath]) {
                                    filesByRepo[file.repo_id].folders[folderPath] = [];
                                }
                                filesByRepo[file.repo_id].folders[folderPath].push(file);
                            } else {
                                filesByRepo[file.repo_id].files.push(file);
                            }
                        });

                        // Generate HTML for each repository's files
                        Object.entries(filesByRepo).forEach(([repoId, repo]) => {
                            html += `
                                <div class="mb-4 border-t pt-2">
                                    <div class="font-medium mb-2">📦 ${repo.repo_name}</div>
                            `;

                            // Folders
                            Object.entries(repo.folders).forEach(([folderPath, folderFiles]) => {
                                const folderId = `folder-${repoId}-${folderPath.replace(/\//g, '-')}`;
                                const iconId = `folder-icon-${repoId}-${folderPath.replace(/\//g, '-')}`;
                                html += `
                                    <div class="ml-4 mb-2">
                                        <div class="folder-toggle flex items-center gap-2 p-1 rounded"
                                             onclick="toggleFolder(${repoId}, '${folderPath}')">
                                            <span id="${iconId}" class="mr-1">📁</span>
                                            <span class="text-sm text-gray-600 hover:text-gray-900">
                                                ${folderPath}
                                            </span>
                                            <button onclick="selectAllInFolder(${repoId}, '${folderPath}', event)"
                                                    class="ml-2 text-xs text-blue-600 hover:text-blue-800 px-2 py-1 rounded border border-blue-600 hover:bg-blue-50">
                                                Select All
                                            </button>
                                        </div>
                                        <div id="${folderId}" class="folder-content hidden">
                                            ${folderFiles.map(file => `
                                                <div id="file-${file.id}"
                                                     class="p-2 rounded cursor-pointer hover:bg-gray-50 transition-colors flex items-center"
                                                     onclick="toggleFileSelection(${file.id}, this)">
                                                    <span class="mr-2">📄</span>
                                                    <div class="text-sm">${file.file_path.split('/').pop()}</div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `;
                            });

                            // Root files
                            repo.files.forEach(file => {
                                html += `
                                    <div id="file-${file.id}"
                                         class="p-2 ml-4 rounded cursor-pointer hover:bg-gray-50 transition-colors flex items-center"
                                         onclick="toggleFileSelection(${file.id}, this)">
                                        <span class="mr-2">📄</span>
                                        <div class="text-sm">${file.file_path}</div>
                                    </div>
                                `;
                            });

                            html += '</div>';
                        });

                        html += '</div>';
                    }

                    resultsDiv.innerHTML = html || '<div class="text-gray-500">No results found</div>';
                } else {
                    throw new Error(results.error);
                }
            } catch (error) {
                resultsDiv.innerHTML = `Error: ${error.message}`;
            } finally {
                searchButton.disabled = false;
            }
        }

        async function submitPrompt() {
            const prompt = document.getElementById('promptInput').value;
            const responseDiv = document.getElementById('response');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const submitButton = document.getElementById('submitButton');

            if (!prompt) {
                alert('Please enter a prompt');
                return;
            }

            responseDiv.textContent = '';
            loadingIndicator.classList.remove('hidden');
            submitButton.disabled = true;

            try {
                const response = await fetch('/stream_prompt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        file_ids: Array.from(selectedFiles),
                        prompt: prompt
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const {value, done} = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            if (data.error) {
                                responseDiv.textContent += `Error: ${data.error}\n`;
                                return;
                            }
                            responseDiv.textContent += data.text;
                        }
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                responseDiv.textContent = `Error: ${error.message}`;
            } finally {
                loadingIndicator.classList.add('hidden');
                submitButton.disabled = false;
            }
        }

        async function addRepository() {
            const repoUrl = document.getElementById('repoUrl').value;
            const statusDiv = document.getElementById('repoStatus');

            if (!repoUrl) {
                alert('Please enter a repository URL');
                return;
            }

            statusDiv.textContent = 'Adding repository...';
            statusDiv.className = 'mt-2 text-sm text-blue-500';

            try {
                const response = await fetch('/add_repository', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ repo_url: repoUrl }),
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = data.message;
                    statusDiv.className = 'mt-2 text-sm text-green-500';
                    document.getElementById('repoUrl').value = '';
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                statusDiv.textContent = `Error: ${error.message}`;
                statusDiv.className = 'mt-2 text-sm text-red-500';
            }
        }
    </script>
</body>
</html>
